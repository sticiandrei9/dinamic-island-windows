<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title>Dynamic Island</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <svg id="shape" width="520" height="340" viewBox="0 0 520 340" aria-hidden="true">
      <path id="shape-path" d="" />
      <path id="bubble-path" d="" />
    </svg>

    <!-- pastila compactă: conținutul depinde de activitatea din ea -->
    <div id="compact" class="layer" data-kind="">
      <div class="c-slot c-media">
        <img id="c-art" class="art" alt="" />
        <div class="viz"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="c-slot c-timer">
        <span class="c-icon" id="c-timer-icon"></span>
        <span class="c-time" id="c-timer-text"></span>
      </div>
      <div class="c-slot c-meet">
        <span class="c-icon" id="c-meet-icon"></span>
        <span class="c-meet-text" id="c-meet-text"></span>
      </div>
      <div class="c-slot c-claude">
        <span class="c-icon" id="c-claude-icon"></span>
        <span class="c-claude-text" id="c-claude-text"></span>
      </div>
      <div class="c-slot c-download">
        <svg class="d-ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="bg" cx="12" cy="12" r="9" /><circle class="fg" cx="12" cy="12" r="9" /></svg>
        <b id="c-download-name"></b>
        <span id="c-download-info"></span>
      </div>
      <div class="c-slot c-call">
        <button class="c-mic" id="c-mic"></button>
        <span class="c-call-text" id="c-call-text"></span>
      </div>
      <span class="dots" id="c-dots"><i class="dot mic"></i><i class="dot cam"></i></span>
    </div>

    <!-- bula: a doua activitate, ca pe iPhone -->
    <div id="bubble" data-kind="">
      <img id="b-art" alt="" />
      <span id="b-claude"></span>
      <svg id="b-download" class="d-ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="bg" cx="12" cy="12" r="9" /><circle class="fg" cx="12" cy="12" r="9" /></svg>
      <svg id="b-ring" viewBox="0 0 32 32"><circle class="bg" cx="16" cy="16" r="11" /><circle class="fg" cx="16" cy="16" r="11" /></svg>
    </div>

    <!-- activități tranzitorii: alertă, volum, notificare, update -->
    <div id="transient" class="layer" data-kind="">
      <div class="t-row t-alert">
        <span class="t-icon" id="t-icon"></span>
        <div class="t-text"><b id="t-title"></b><span id="t-detail"></span></div>
        <svg id="t-ring" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9" /><circle class="fg" cx="12" cy="12" r="9" /></svg>
      </div>
      <div class="t-row t-volume">
        <span class="t-icon" id="v-icon"></span>
        <div class="v-track"><div id="v-fill"></div></div>
        <span class="v-pct" id="v-pct"></span>
      </div>
      <div class="t-row t-shot">
        <img id="s-thumb" alt="" />
        <div class="t-text"><b data-i18n="shot.title"></b><span id="s-size"></span></div>
        <button class="pill-btn" id="s-save" data-i18n="shot.save"></button>
        <button class="pill-btn green" id="s-shelf" data-i18n="shot.shelf"></button>
        <button class="s-close" id="s-close" aria-label="×">×</button>
      </div>
      <div class="t-row t-download">
        <span class="d-file" id="d-file"></span>
        <div class="t-text"><b id="d-name"></b><span id="d-size"></span></div>
        <button class="pill-btn" id="d-open" data-i18n="download.open"></button>
        <button class="pill-btn green" id="d-reveal" data-i18n="download.reveal"></button>
        <button class="s-close" id="d-close" aria-label="×">×</button>
      </div>
      <div class="t-row t-notif">
        <img id="n-icon" alt="" />
        <div class="t-text"><span id="n-app"></span><b id="n-title"></b><span id="n-body"></span></div>
      </div>
    </div>

    <div id="expanded" class="layer">
      <nav id="tabs"></nav>

      <div class="pane" data-pane="home">
        <section id="x-media">
          <div class="row-top">
            <img id="x-art" class="art" alt="" />
            <div class="meta">
              <div id="x-title" class="title"></div>
              <div id="x-artist" class="artist"></div>
            </div>
            <div class="viz big"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div id="x-lyrics" class="lyrics"><div class="ly-cur"></div><div class="ly-next"></div></div>
          <div class="progress">
            <span id="x-pos">0:00</span>
            <div class="track"><div id="x-fill" class="fill"></div></div>
            <span id="x-rem">-0:00</span>
          </div>
          <div class="controls">
            <button data-action="prev" data-i18n-aria="media.prev">
              <svg viewBox="0 0 28 20"><path d="M13 4.2v11.6L4 10z M25 4.2v11.6L16 10z" /></svg>
            </button>
            <button data-action="play_pause" data-i18n-aria="media.play" id="x-play"></button>
            <button data-action="next" data-i18n-aria="media.next">
              <svg viewBox="0 0 28 20"><path d="M3 4.2v11.6L12 10z M15 4.2v11.6L24 10z" /></svg>
            </button>
          </div>
        </section>
        <section id="x-clock">
          <div id="x-time" class="clock-time"></div>
          <div id="x-date" class="clock-date"></div>
        </section>
        <div id="x-cal" class="cal-row" hidden></div>
        <div id="x-claude" class="claude-row" hidden></div>
        <div id="x-privacy" class="privacy-row" hidden></div>
        <div id="x-out" class="out-row" hidden></div>
        <div id="x-apps" class="apps"></div>
        <div id="x-update" class="update-row" hidden>
          <span id="x-update-text"></span>
          <button id="x-update-apply" data-i18n="update.apply"></button>
        </div>
      </div>

      <div class="pane" data-pane="timer"></div>
      <div class="pane" data-pane="system"></div>
      <div class="pane" data-pane="clipboard"></div>
      <div class="pane" data-pane="notes"></div>
      <div class="pane" data-pane="shelf"></div>
      <div class="pane" data-pane="mirror"></div>
    </div>
  </div>
  <script type="module" src="island.js"></script>
</body>
</html>
