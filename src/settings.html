<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title data-i18n="settings.title">Setări — Dynamic Island</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main>
    <header>
      <div class="app-icon"><span></span></div>
      <div>
        <h1>Dynamic Island</h1>
        <p class="sub" id="version"></p>
      </div>
    </header>

    <h2 data-i18n="settings.modules"></h2>
    <section class="group" id="modules"></section>

    <h2 data-i18n="settings.behavior"></h2>
    <section class="group">
      <div class="row">
        <div class="label"><span data-i18n="settings.expand"></span><small data-i18n="settings.expandHint"></small></div>
        <div class="segmented" data-key="expand_on">
          <button data-value="hover" data-i18n="settings.hover"></button>
          <button data-value="click" data-i18n="settings.click"></button>
        </div>
      </div>
      <div class="row">
        <div class="label"><span data-i18n="settings.hotkey"></span><small id="hotkey-hint" data-i18n="settings.hotkeyHint"></small></div>
        <div class="buttons">
          <button class="btn" id="hotkey"></button>
          <button class="btn" id="hotkey-clear" data-i18n="settings.hotkeyClear"></button>
        </div>
      </div>
      <div class="row">
        <div class="label"><span data-i18n="settings.shelfDays"></span><small data-i18n="settings.shelfDaysHint"></small></div>
        <select id="shelf-days"></select>
      </div>
      <div class="row">
        <div class="label" data-i18n="settings.language"></div>
        <select id="language">
          <option value="auto" data-i18n="settings.langAuto"></option>
          <option value="ro">Română</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
      </div>
    </section>

    <h2 data-i18n="settings.calendar"></h2>
    <section class="group">
      <div class="row col">
        <div class="label"><span data-i18n="settings.calendarLink"></span><small id="calendar-hint" data-i18n="settings.calendarHint"></small></div>
        <input type="password" id="calendar-url" spellcheck="false" autocomplete="off" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics" />
      </div>
    </section>

    <h2 data-i18n="settings.display"></h2>
    <section class="group">
      <div class="row">
        <div class="label"><span data-i18n="settings.monitor"></span><small data-i18n="settings.monitorHint"></small></div>
        <select id="monitor"></select>
      </div>
      <div class="row">
        <div class="label" data-i18n="settings.size"></div>
        <div class="segmented" data-key="size">
          <button data-value="small" data-i18n="settings.small"></button>
          <button data-value="normal" data-i18n="settings.normal"></button>
          <button data-value="large" data-i18n="settings.large"></button>
        </div>
      </div>
    </section>

    <h2 data-i18n="settings.startup"></h2>
    <section class="group">
      <div class="row">
        <div class="label" data-i18n="tray.autostart"></div>
        <label class="switch"><input type="checkbox" data-key="autostart" /><span></span></label>
      </div>
      <div class="row">
        <div class="label"><span data-i18n="settings.autoUpdate"></span><small data-i18n="settings.autoUpdateHint"></small></div>
        <label class="switch"><input type="checkbox" data-key="auto_update" /><span></span></label>
      </div>
      <div class="row">
        <div class="label" id="update-status"></div>
        <div class="buttons">
          <button class="btn" id="check-now" data-i18n="settings.checkNow"></button>
          <button class="btn primary" id="apply" hidden data-i18n="update.apply"></button>
        </div>
      </div>
      <div class="row">
        <div class="label"><span data-i18n="settings.log"></span><small data-i18n="settings.logHint"></small></div>
        <button class="btn" id="open-logs" data-i18n="settings.openFolder"></button>
      </div>
    </section>

    <p class="footnote" data-i18n="settings.footnote"></p>
  </main>
  <script type="module" src="settings.js"></script>
</body>
</html>
